name: Package Aurion 15.3.20 export integration
on:
  push:
    branches:
      - fix/aurion-15.3.20-export-blocs-5-8-20261031
permissions:
  contents: read
jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend --include=dev --no-audit --no-fund
      - name: Compile backend (required control; not a test suite)
        run: npm run build
      - name: Run only the new export-integration contract tests
        run: node --test backend/tests/accounting-export-hardening.contract.test.mjs
      - name: Package full 15.3.20 source archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION.txt)"
          test "$VERSION" = "15.3.20"
          mkdir -p dist-artifacts
          git archive --format=zip --prefix="Aurion-$VERSION-export-blocs-5-8/" -o "dist-artifacts/Aurion-$VERSION-export-blocs-5-8.zip" HEAD -- . ':(exclude).github/workflows/aurion-export-integration-package.yml'
          sha256sum dist-artifacts/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aurion-source-15.3.20-export-blocs-5-8
          path: dist-artifacts/Aurion-15.3.20-export-blocs-5-8.zip
          if-no-files-found: error
          retention-days: 14
