name: Aurion CI — build, typecheck, smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend --include=dev --no-audit --no-fund
      - name: Build, type check and targeted smoke tests
        run: npm run check

      - name: Package complete source archive
        run: |
          mkdir -p dist-artifacts
          git archive --format=zip --prefix=Aurion-15.2.31/ -o "dist-artifacts/Aurion-15.2.31-source-${GITHUB_SHA:0:7}.zip" HEAD
          sha256sum dist-artifacts/*.zip

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: aurion-source-${{ github.sha }}
          path: dist-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
