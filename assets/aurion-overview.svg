      <rect x="523" y="352" width="212" height="104" rx="14" fill="#f8fbff" stroke="#dce7f6"/><text x="545" y="382" fill="#71839b" font-family="Arial,sans-serif" font-size="13">Devis en cours</text><text x="545" y="425" fill="#172b49" font-family="Arial,sans-serif" font-size="30" font-weight="700">—</text><circle cx="698" cy="383" r="17" fill="#eee9ff"/><circle cx="698" cy="383" r="7" fill="#9370ef"/>
      <rect x="746" y="352" width="212" height="104" rx="14" fill="#f8fbff" stroke="#dce7f6"/><text x="768" y="382" fill="#71839b" font-family="Arial,sans-serif" font-size="13">CA HT du mois</text><text x="768" y="425" fill="#172b49" font-family="Arial,sans-serif" font-size="30" font-weight="700">—</text><circle cx="921" cy="383" r="17" fill="#e5faf4"/><circle cx="921" cy="383" r="7" fill="#21af86"/>
      <rect x="969" y="352" width="233" height="104" rx="14" fill="#f8fbff" stroke="#dce7f6"/><text x="991" y="382" fill="#71839b" font-family="Arial,sans-serif" font-size="13">Rendez-vous</text><text x="991" y="425" fill="#172b49" font-family="Arial,sans-serif" font-size="30" font-weight="700">—</text><circle cx="1165" cy="383" r="17" fill="#fff1e7"/><circle cx="1165" cy="383" r="7" fill="#ef9a45"/>
