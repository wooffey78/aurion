<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Tableau de bord Aurion</title>
  <desc id="desc">Aperçu du tableau de bord Aurion avec le journal de bord, les clients, les devis, l’agenda et la trésorerie.</desc>
  <defs>
