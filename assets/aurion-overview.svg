    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2872ee"/><stop offset="1" stop-color="#22b8e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#173252" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1280" height="800" rx="34" fill="url(#back)"/>
  <circle cx="1170" cy="84" r="180" fill="#c9defb" opacity=".42"/>
  <circle cx="75" cy="730" r="160" fill="#bed7fa" opacity=".38"/>
