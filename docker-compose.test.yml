services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aurion_test
      POSTGRES_USER: aurion_test
      POSTGRES_PASSWORD: aurion_test_local_only
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurion_test -d aurion_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - aurion-test-postgres:/var/lib/postgresql/data
volumes:
  aurion-test-postgres:
